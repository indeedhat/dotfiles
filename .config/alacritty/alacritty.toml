[font]
size = 11
offset.y = 1

[font.bold]
family = "OpenDyslexicM Nerd Font Mono"
style = "Bold"

[font.italic]
family = "OpenDyslexicM Nerd Font Mono"
style = "Italic"

[font.normal]
family = "OpenDyslexicM Nerd Font Mono"
style = "Regular"

[window]
opacity = 0.97
dynamic_title = true

[general]
import = [
    "base16-default-dark.toml"
]

[[keyboard.bindings]]
chars = "\u001c"
key = "¥"
mods = "Control"

#######################################
# VARIABLES
#######################################
$mod = SUPER
$left = h
$down = j
$up = k
$right = l

# Audio scripts (converted literally)
$sink_volume = bash -c "pactl get-sink-volume @DEFAULT_SINK@ | grep '^Volume:' | cut -d / -f 2 | tr -d ' ' | sed 's/%//'"
$source_volume = bash -c "pactl get-source-volume @DEFAULT_SOURCE@ | grep '^Volume:' | cut -d / -f 2 | tr -d ' ' | sed 's/%//'"
$volume_down = bash -c "pactl set-sink-volume @DEFAULT_SINK@ -5%"
$volume_up =   bash -c "pactl set-sink-volume @DEFAULT_SINK@ +5%"
$volume_mute  =bash -c "pactl set-sink-mute @DEFAULT_SINK@ toggle"
$mic_mute =    bash -c "pactl set-source-mute @DEFAULT_SOURCE@ toggle"

$term_float = alacritty
#$menu = wofi -c ~/.config/wofi/config -I
$powermenu = ~/.config/waybar/scripts/power-menu.sh

#######################################
# APPLICATION BINDINGS
#######################################
bind = $mod, Return, exec, $term_float
bind = $mod, p, exec, $powermenu
bind = $mod, q, killactive
bind = $mod, BackSpace, killactive
bind = $mod, d, exec, $menu
bind = $mod, Tab, exec, ~/.config/wofi/windows.py

# Reload
bind = $mod, C, exec, hyprctl reload

#######################################
# MOVING AROUND
#######################################
# Focus
bind = $mod, $left, movefocus, l
bind = $mod, $down, movefocus, d
bind = $mod, $up, movefocus, u
bind = $mod, $right, movefocus, r

# Arrows
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

# Move windows
bind = $mod SHIFT, $left, movewindow, l
bind = $mod SHIFT, $down, movewindow, d
bind = $mod SHIFT, $up, movewindow, u
bind = $mod SHIFT, $right, movewindow, r

bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

#######################################
# WORKSPACES
#######################################
# Switch
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10


#######################################
# LAYOUT / WINDOW OPERATIONS
#######################################
bind = $mod, f, fullscreen, 1
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, cyclenext
#bind = $mod, A, focusparent

# Split directions (Hyperland doesn’t use splitv/splith — using pseudo)
bind = $mod, b, exec, hyprctl keyword general:layout dwindle
bind = $mod, v, exec, hyprctl keyword general:layout master

# Tabs/Stacking → Hyperland doesn’t support these → mapped to dwindle
bind = $mod, s, exec, hyprctl keyword general:layout dwindle
bind = $mod, w, exec, hyprctl keyword general:layout master
bind = $mod, e, exec, hyprctl keyword general:layout togglesplit

#######################################
# SCRATCHPAD → Hyperland Special Workspace
#######################################
workspace = special:scratchpad, on-created-empty:[float; size 1600 900; center] alacritty
bind = $mod SHIFT, TAB, movetoworkspace, scratchpad
bind = $mod, TAB, togglespecialworkspace, scratchpad

#######################################
# RESIZE WINDOWS
#######################################
bind = $mod, r, submap, resize

submap = resize
  bind = , $left, resizeactive, -10 0
  bind = , $right, resizeactive, 10 0
  bind = , $up, resizeactive, 0 -10
  bind = , $down, resizeactive, 0 10

  bind = , Left, resizeactive, -10 0
  bind = , Right, resizeactive, 10 0
  bind = , Up, resizeactive, 0 -10
  bind = , Down, resizeactive, 0 10

  bind = , Escape, submap, reset
  bind = , Return, submap, reset
submap = reset

#######################################
# MOUSE WINDOW RESIZE
#######################################
binde = $mod, mouse_up, resizeactive, 0 -5
binde = $mod, mouse_down, resizeactive, 0 5
binde = $mod SHIFT, mouse_up, resizeactive, -5 0
binde = $mod SHIFT, mouse_down, resizeactive, 5 0

#######################################
# AUDIO
#######################################
bindl =, XF86AudioRaiseVolume, exec, $volume_up
bindl =, XF86AudioLowerVolume, exec, $volume_down
bindl =, XF86AudioMute, exec, $volume_mute

#######################################
# PLAYER
#######################################
bind = , XF86AudioPlay, exec, playerctl play
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

#######################################
# BACKLIGHT
#######################################
bind = , XF86MonBrightnessUp, exec, brightnessctl -c backlight set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -c backlight set 5%-

#######################################
# APP SHORTCUTS
#######################################
bind = $mod, n, exec, thunar
bind = $mod ALT, c, exec, brave

#######################################
# SCREENSHOTS
#######################################
bind = , Print, exec, /usr/share/sway/scripts/grimshot --notify save output
bind = $mod, c, exec, ~/.config/sway/scripts/screenshot.sh

#######################################
# KEYBINDING CHEATSHEET
#######################################
bind = $mod, t, exec, xed ~/.config/sway/cheatsheet

#######################################
# LOCK SCREEN
#######################################
bind = CTRL ALT, L, exec, hyprlock


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
